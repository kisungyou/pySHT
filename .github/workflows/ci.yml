name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install -e ".[test]" "ruff>=0.9" "mypy>=1.14"
      - name: Lint
        run: |
          ruff check src tests tools docs/conf.py
          ruff format --check src tests tools docs/conf.py
      - name: Type check
        run: mypy src/pysht

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests with branch coverage
        run: python -m pytest --cov=pysht --cov-report=term-missing

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and documentation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build documentation with warnings as errors
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

  package:
    name: Build distributions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install "build>=1.2" "twine>=6.0"
      - name: Build wheel and source distribution
        if: runner.os != 'macOS'
        run: python -m build
      - name: Build wheel and source distribution for macOS 11+
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: python -m build
      - name: Check distribution metadata
        shell: bash
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  wheel-smoke:
    name: Wheel smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: distributions-${{ matrix.os }}
          path: wheelhouse
      - name: Install runtime dependencies
        run: python -m pip install "numpy>=2.1" "scipy>=1.15"
      - name: Install the built wheel
        shell: bash
        run: python -m pip install --no-deps wheelhouse/*.whl
      - name: Exercise the installed wheel in isolated mode
        run: python -I tools/wheel_smoke.py
